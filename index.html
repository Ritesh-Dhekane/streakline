<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An elegant view of anyone's public GitHub activity." />
    <title>Streakline</title>
    <script>
      // Apply the saved theme before first paint so light mode never flashes dark.
      try {
        if (localStorage.getItem('streakline-theme') === 'light')
          document.documentElement.classList.remove('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
